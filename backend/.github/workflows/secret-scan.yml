# Secret scan — fails (and GitHub emails you) if any file in the repo contains
# something that looks like a key, password or token.
#
# Runs on every push and pull request. It scans the files as they are after
# the push. Old commits are not scanned on purpose: the history still holds
# credentials from before the October 2026 cleanup, and those have been
# rotated, so they no longer work.
#
# If it flags something that is NOT a secret (a test value, say), add
#   # gitleaks:allow
# at the end of that line.
name: Secret scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.28.0
        run: |
          # Outside the repo folder, so the scan doesn't read the tool itself.
          cd "$RUNNER_TEMP"
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version

      - name: Scan files
        run: $RUNNER_TEMP/gitleaks dir . --redact --no-banner --exit-code 1