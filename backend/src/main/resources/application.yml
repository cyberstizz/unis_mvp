server:
  port: 8080
  error:
    include-message: always

cloudflare:
  r2:
    access-key: ${R2_ACCESS_KEY}
    secret-key: ${R2_SECRET_KEY}
    endpoint: ${R2_ENDPOINT}
    bucket-name: ${R2_BUCKET_NAME}
    public-url: ${R2_PUBLIC_URL}

file:
  upload-dir: uploads
  storage-mode: local

resend:
  api:
    key: ${RESEND_API_KEY}
  from:
    email: noreply@charleslambjr.com

stripe:
  secret:
    key: ${STRIPE_SECRET_KEY}

twilio:
  account-sid: ${TWILIO_ACCOUNT_SID:}
  auth-token: ${TWILIO_AUTH_TOKEN:}
  verify-service-sid: ${TWILIO_VERIFY_SERVICE_SID:}

spring:
  application:
    name: unis

  profiles:
    active: local

  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=5m
    cache-names:
      - songs
      - artists
      - jurisdictions
      - genres
      - trending
      - userProfiles

  web:
    resources:
      static-locations: classpath:/static,classpath:/uploads

  datasource:
    url: jdbc:postgresql://localhost:5432/unis
    username: unis_user
    # Local development only. Set LOCAL_DB_PASSWORD on your machine; never commit a real one.
    password: ${LOCAL_DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  sql:
    init:
      mode: never

  task:
    scheduling:
      pool:
        size: 2

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  jwt:
    # No default on purpose: a secret written here is public (it was, in the
    # repo history), and anyone holding it can sign their own login tokens,
    # admin ones included. The app refuses to start without JWT_SECRET.
    secret: ${JWT_SECRET}
    expiration: 86400000

logging:
  level:
    org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration: DEBUG
    org.springframework.boot.autoconfigure.jdbc: DEBUG
    com.zaxxer.hikari: DEBUG
    org.springframework.jdbc.datasource: DEBUG
    org.springframework: INFO
    com.unis: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web.multipart: DEBUG

unis:
  auto-populate-awards: true