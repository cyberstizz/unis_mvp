server:
  port: 8080
  error:
    include-message: always
  # Gzip JSON responses. Song lists are 5-10 KB per song uncompressed and
  # Spring Boot doesn't compress unless told to; a 20-song feed list measured
  # 181 KB raw vs 7 KB gzipped (0.25 ms of CPU). Big win on phone data.
  compression:
    enabled: true
    mime-types: application/json,text/plain,text/html,text/css,application/javascript
    min-response-size: 1024

cloudflare:
  r2:
    access-key: ${R2_ACCESS_KEY}
    secret-key: ${R2_SECRET_KEY}
    endpoint: ${R2_ENDPOINT}
    bucket-name: ${R2_BUCKET_NAME}
    public-url: ${R2_PUBLIC_URL}

file:
  upload-dir: uploads
  storage-mode: local

resend:
  api:
    key: ${RESEND_API_KEY}
  from:
    email: noreply@charleslambjr.com

stripe:
  secret:
    key: ${STRIPE_SECRET_KEY}

twilio:
  account-sid: ${TWILIO_ACCOUNT_SID:}
  auth-token: ${TWILIO_AUTH_TOKEN:}
  verify-service-sid: ${TWILIO_VERIFY_SERVICE_SID:}

spring:
  application:
    name: unis

  profiles:
    active: local

  # (The old spring.cache block was removed: config/CacheConfig.java defines
  # every cache, its size and its lifetime, and replaces Spring Boot's own
  # cache setup, so those lines never did anything.)

  web:
    resources:
      static-locations: classpath:/static,classpath:/uploads

  datasource:
    url: jdbc:postgresql://localhost:5432/unis
    username: unis_user
    # Local development only. Set LOCAL_DB_PASSWORD on your machine; never commit a real one.
    password: ${LOCAL_DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    # Connection pool (HikariCP), stated explicitly instead of left to defaults.
    # Applies in production too (application-prod.yml only sets url/user/password).
    # 10 per backend instance fits Supabase Micro (60 direct connections) with
    # room for Supabase's own services. With N Railway replicas the total is
    # 10 x N; keep it under the "Pool Size" in Supabase's database settings.
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      # (minimum-idle left at its default, the same as the pool size: a fixed
      # pool, so a burst never waits on new TLS connections to Supabase.)
      # Fail a request after 10 s waiting for a connection instead of 30 s:
      # under overload, fast errors beat a pile-up of 30-second requests.
      connection-timeout: 10000
      # Recycle each connection every 10 minutes, and ping idle ones every 2,
      # so the Supabase pooler or a network device never silently drops one.
      max-lifetime: 600000
      keepalive-time: 120000

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        # Load related rows (a song's artist, genre, jurisdiction...) in batches
        # of up to 50 per query instead of one query per row. Every list of
        # songs, awards and users was doing one lookup per item.
        default_batch_fetch_size: 50

  sql:
    init:
      mode: never

  task:
    scheduling:
      pool:
        # 14 scheduled jobs shared 2 threads; the Sunday email (minutes of
        # sending) could hold up the hourly race close. 4 is plenty.
        size: 4

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  jwt:
    # No default on purpose: a secret written here is public (it was, in the
    # repo history), and anyone holding it can sign their own login tokens,
    # admin ones included. The app refuses to start without JWT_SECRET.
    secret: ${JWT_SECRET}
    expiration: 86400000

logging:
  level:
    org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration: DEBUG
    org.springframework.boot.autoconfigure.jdbc: DEBUG
    com.zaxxer.hikari: DEBUG
    org.springframework.jdbc.datasource: DEBUG
    org.springframework: INFO
    com.unis: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web.multipart: DEBUG

unis:
  auto-populate-awards: true