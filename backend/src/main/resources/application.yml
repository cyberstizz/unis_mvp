cloudflare:
  r2:
    access-key: ${R2_ACCESS_KEY}
    secret-key: ${R2_SECRET_KEY}
    endpoint: ${R2_ENDPOINT}
    bucket-name: ${R2_BUCKET_NAME}
    public-url: ${R2_PUBLIC_URL}

file:
  upload-dir: uploads
  storage-mode: local   

spring:
  application:
    name: unis
  profiles:
    active: local
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=5m
    cache-names:
      - songs
      - artists
      - jurisdictions
      - genres
      - trending
      - userProfiles
  web:
    resources:
      static-locations: classpath:/static,classpath:/uploads

  datasource:
    url: jdbc:postgresql://localhost:5432/unis
    username: unis_user
    password: "$ucce$$7"
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  sql:
    init:
      mode: never

  task:
    scheduling:
      pool:
        size: 2

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  jwt:
    secret: unis-super-secret-key-change-this-in-production-should-be-at-least-256-bits-long
    expiration: 86400000

server:
  port: 8080

logging:
  level:
    org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration: DEBUG
    org.springframework.boot.autoconfigure.jdbc: DEBUG
    com.zaxxer.hikari: DEBUG
    org.springframework.jdbc.datasource: DEBUG
    org.springframework: INFO
    com.unis: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web.multipart: DEBUG

unis:
  auto-populate-awards: true
