spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  jwt:
    secret: ${JWT_SECRET}
    expiration: 86400000

file:
  storage-mode: r2

resend:
  api:
    key: ${RESEND_API_KEY}
  from:
    email: ${RESEND_FROM_EMAIL:noreply@charleslambjr.com}
    name: ${RESEND_FROM_NAME:Unis}

unis:
  auto-populate-awards: true
  app-base-url: ${UNIS_APP_BASE_URL:http://localhost:5173}
  api-base-url: ${UNIS_API_BASE_URL:http://localhost:8080}
  media-base-url: ${UNIS_MEDIA_BASE_URL:https://cdn.unismusic.com}
  digest:
    enabled: ${UNIS_DIGEST_ENABLED:true}
    cron: "0 0 13 * * SUN"
    daily-limit: ${UNIS_DIGEST_DAILY_LIMIT:90}
    throttle-ms: 150
  mail:
    postal-address: ${UNIS_MAIL_POSTAL_ADDRESS:}

logging:
  level:
    com.unis: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG