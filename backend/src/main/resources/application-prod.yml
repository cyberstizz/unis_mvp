spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  jwt:
    secret: ${JWT_SECRET}
    expiration: 86400000

file:
  storage-mode: r2

resend:
  api:
    key: ${RESEND_API_KEY}
  from:
    email: ${RESEND_FROM_EMAIL:noreply@charleslambjr.com}
    name: ${RESEND_FROM_NAME:Unis}

unis:
  auto-populate-awards: true
  app-base-url: ${UNIS_APP_BASE_URL:http://localhost:5173}
  api-base-url: ${UNIS_API_BASE_URL:http://localhost:8080}
  media-base-url: ${UNIS_MEDIA_BASE_URL:https://cdn.unismusic.com}
  digest:
    enabled: ${UNIS_DIGEST_ENABLED:true}
    cron: "0 0 13 * * SUN"
    daily-limit: ${UNIS_DIGEST_DAILY_LIMIT:90}
    throttle-ms: 150
  mail:
    postal-address: ${UNIS_MAIL_POSTAL_ADDRESS:}
  # Pre-launch: only admin accounts can sign in (AuthController). "true" until
  # launch day, then "false" — same moment you turn VITE_PRELAUNCH off on Netlify.
  prelaunch: ${UNIS_PRELAUNCH:false}
  # Encrypts staff authenticator secrets (AdminMfaService). 32 random bytes,
  # base64: run `openssl rand -base64 32`. Keep a copy in your password manager.
  mfa:
    key: ${UNIS_MFA_KEY:}

# Production logs at INFO. DEBUG on org.springframework.web printed request
# bodies — including sign-in passwords and new login tokens — into the Railway
# logs. To debug something briefly, add a Railway variable such as
# LOGGING_LEVEL_COM_UNIS=DEBUG, then remove it when you're done.
logging:
  level:
    com.unis: INFO
    org.springframework: INFO
    org.springframework.security: WARN
    org.springframework.web: WARN
    org.springframework.boot.autoconfigure.jdbc: INFO
    org.springframework.jdbc.datasource: INFO
    com.zaxxer.hikari: INFO
    org.springframework.web.multipart: INFO
    org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration: INFO