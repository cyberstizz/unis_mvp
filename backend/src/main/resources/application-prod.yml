spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  jwt:
    secret: ${JWT_SECRET}
    expiration: 86400000

  file:
    storage-mode: r2

  resend:
  api:
    key: ${RESEND_API_KEY}
  from:
    email: Unis <onboarding@resend.dev>


  unis:
    auto-populate-awards: true

  logging:
    level:
      com.unis: DEBUG
      org.springframework.security: DEBUG
      org.springframework.web: DEBUG