spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  jwt:
    secret: ${JWT_SECRET}
    expiration: 86400000

  file:
    storage-mode: r2

  resend:
  api:
    key: ${RESEND_API_KEY}
  from:
    email: noreply@charleslambjr.com


  unis:
    auto-populate-awards: true
    app-base-url: ${UNIS_APP_BASE_URL:http://localhost:5173}
    api-base-url: ${UNIS_API_BASE_URL:http://localhost:8080}
    digest:
      enabled: ${UNIS_DIGEST_ENABLED:true}
      cron: "0 0 13 * * SUN"
      daily-limit: 90

  logging:
    level:
      com.unis: DEBUG
      org.springframework.security: DEBUG
      org.springframework.web: DEBUG

  twilio:
  account-sid: ${TWILIO_ACCOUNT_SID:}
  auth-token: ${TWILIO_AUTH_TOKEN:}
  verify-service-sid: ${TWILIO_VERIFY_SERVICE_SID:}