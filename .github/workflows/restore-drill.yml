Good news: it failed at the earliest possible point, before downloading or erasing anything. Nothing was touched.

The cause: when you copied the connection string, you got the Direct connection one rather than the Session pooler one. You can see it in the error, db.crunkhtbxzchotvbwlkz.supabase.co. Supabase's direct connection only works over the newer style of internet addressing called IPv6, and GitHub's machines don't have it. That's exactly what "Network is unreachable" means. The pooler works over the older style that GitHub does have, which is why the backup workflow connects fine.

A quick way to tell them apart:

Wrong one contains db. and ends in .supabase.co
Right one contains pooler.supabase.com
Get the correct string
Go to supabase.com/dashboard and open the unis-restore-drill project. Check the organization switcher at the top left says Lamb Services DR, so you're definitely not in the Unis project.
Click Connect at the top of the page.
A panel opens showing several connection options. Scroll down past Direct connection and Transaction pooler until you reach Session pooler. Copy the string from that section.
Confirm it contains pooler.supabase.com. If it doesn't, you've got the wrong section.
Replace [YOUR-PASSWORD] with the password you set when creating the project. If that password contains any of @ # / ? : %, tell me before continuing, since those characters have to be written specially.
Replace the secret
GitHub won't let you view an existing secret, only overwrite it.

GitHub → unis_mvp → Settings → Secrets and variables → Actions.
